<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Health Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400&display=swap" rel="stylesheet"> <!-- Bubbly Font -->
    <style>
        body {
            font-family: 'Baloo 2', cursive; /* Bubbly font */
            background-image: url('static/backgroundmain.gif'); /* Background image */
            background-size: cover;
            height: 100vh; /* Full viewport height */
            margin: 0;
            display: flex; /* Use Flexbox */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            color: white;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Text shadow */
        }
        button {
            background-color: #ff69b4; /* Pink color */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 20px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s; /* Smooth transition */
        }
        button:hover {
            background-color: #ff1493; /* Darker pink on hover */
        }
    </style>
</head>
<body>
    <div>
        <h1>Welcome to the Medical Health Prediction App</h1>
        <a href="/index"><button>Start Prediction</button></a>
    </div>
</body>
</html>
