<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400&display=swap" rel="stylesheet"> <!-- Bubbly Font -->
    <style>
        body {
            font-family: 'Baloo 2', cursive; /* Bubbly font */
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            align-items: center; /* Center horizontally */
        }
        .container {
            margin: 50px auto;
            width: 400px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
        }
        label {
            display: block;
            margin-top: 15px;
            text-align: left;
        }
        input[type="number"], input[type="radio"] {
            margin-top: 5px;
            padding: 8px;
            width: calc(100% - 16px);
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="radio"] {
            width: auto;
        }
        input[type="submit"] {
            margin-top: 20px;
            padding: 10px;
            background-color: #ff69b4; /* Pink color */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s; /* Smooth transition */
        }
        input[type="submit"]:hover {
            background-color: #ff1493; /* Darker pink on hover */
        }
        .psa-container {
            display: flex; /* Use Flexbox for PSA */
            align-items: center; /* Center vertically */
            margin-top: 30px;
            background-color: rgba(255, 255, 255, 0.8); /* Light background for PSA */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            width: 90%; /* Responsive width */
            max-width: 600px; /* Max width */
        }
        .psa-text {
            flex: 1; /* Take remaining space */
            margin-right: 20px; /* Space between text and GIF */
            color: #333; /* Text color */
        }
        .gif-character {
            width: 100px; /* Adjust size as needed */
            height: auto; /* Maintain aspect ratio */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Medical Prediction Form</h1>
        <form action="/predict" method="post">
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female" required> Female

            <label for="glucose">Glucose (70-200 mg/dL):</label>
            <input type="number" name="glucose" required min="70" max="200" placeholder="Enter glucose">

            <label for="blood_pressure">Blood Pressure (50-200 mmHg):</label>
            <input type="number" name="blood_pressure" required min="50" max="200" placeholder="Enter blood pressure">

            <label for="cholesterol">Cholesterol (100-300 mg/dL):</label>
            <input type="number" name="cholesterol" required min="100" max="300" placeholder="Enter cholesterol">

            <label for="insulin">Insulin (0-600):</label>
            <input type="number" name="insulin" required min="0" max="600" placeholder="Enter insulin">

            <label for="bmi">BMI (10-50):</label>
            <input type="number" name="bmi" required min="10" max="50" step="0.1" placeholder="Enter BMI">

            <label for="dpf">Diabetes Pedigree Function (0-2.5):</label>
            <input type="number" name="dpf" required min="0" max="2.5" step="0.01" placeholder="Enter DPF">

            <label for="age">Age (1-100):</label>
            <input type="number" name="age" required min="1" max="100" placeholder="Enter age">

            <input type="submit" value="Predict">
        </form>
    </div>

    <div class="psa-container">
        <div class="psa-text">
            <h2>PSA: Regular Checkups!</h2>
            <p>Don't forget to go for regular medical checkups to maintain your health!</p>
        </div>
        <img src="static/character.gif" alt="Character GIF" class="gif-character"> <!-- Update the src to your GIF file -->
    </div>
</body>
</html>
